# Local dev dependencies: Postgres holds metadata, MinIO holds gzipped
# event chunks, Redis backs the retention/processing queues.
#
# Host ports can be moved via .env (see .env.example) when the defaults
# clash with services you already run.
name: hindcast

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: hindcast
      POSTGRES_PASSWORD: hindcast
      POSTGRES_DB: hindcast
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hindcast -d hindcast"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: hindcast
      MINIO_ROOT_PASSWORD: hindcast-dev
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: make sure the events bucket exists, then exit.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 hindcast hindcast-dev &&
        mc mb --ignore-existing local/hindcast-events
      "

volumes:
  pg-data:
  redis-data:
  minio-data:
