# Local dev dependencies: Postgres holds metadata, MinIO holds gzipped
# event chunks, Redis backs the retention/processing queues.
#
# Host ports can be moved via .env (see .env.example) when the defaults
# clash with services you already run.
name: hindcast

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: hindcast
      POSTGRES_PASSWORD: hindcast
      POSTGRES_DB: hindcast
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hindcast -d hindcast"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: hindcast
      MINIO_ROOT_PASSWORD: hindcast-dev
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: make sure the events bucket exists, then exit.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 hindcast hindcast-dev &&
        mc mb --ignore-existing local/hindcast-events
      "

  # ---------------------------------------------------------------------------
  # The full stack. These live behind the "full" profile, so a plain
  # `docker compose up` still starts only the backing services (the dev
  # workflow), while `docker compose --profile full up --build` runs
  # everything — the whole app, one command.
  # ---------------------------------------------------------------------------

  # One-shot: apply pending migrations, then exit. Ingest and web wait for it.
  migrate:
    profiles: ["full"]
    build: &app-build
      context: .
      dockerfile: Dockerfile
    image: hindcast-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hindcast:hindcast@postgres:5432/hindcast
    command: pnpm --filter @hindcast/db migrate:deploy
    restart: "no"

  ingest:
    profiles: ["full"]
    build: *app-build
    image: hindcast-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: "4100"
      DATABASE_URL: postgresql://hindcast:hindcast@postgres:5432/hindcast
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: hindcast
      S3_SECRET_KEY: hindcast-dev
      S3_BUCKET: hindcast-events
    ports:
      - "${INGEST_PORT:-4100}:4100"
    command: node apps/ingest/dist/main.js
    restart: unless-stopped

  web:
    profiles: ["full"]
    build: *app-build
    image: hindcast-app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # Change this — it's the one secret that opens the dashboard.
      ADMIN_SECRET: "${ADMIN_SECRET:-change-me}"
      DATABASE_URL: postgresql://hindcast:hindcast@postgres:5432/hindcast
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: hindcast
      S3_SECRET_KEY: hindcast-dev
      S3_BUCKET: hindcast-events
      # The ingest host the install snippet points at (what browsers hit).
      HINDCAST_INGEST_URL: "${HINDCAST_INGEST_URL:-http://localhost:4100}"
      # Set to "true" to serve the marketing landing at / (off by default).
      HINDCAST_LANDING: "${HINDCAST_LANDING:-}"
    ports:
      - "${WEB_PORT:-3000}:3000"
    command: pnpm --filter @hindcast/web start
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  minio-data:
