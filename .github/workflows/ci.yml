name: ci

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://hindcast:hindcast@localhost:5432/hindcast
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: hindcast
      S3_SECRET_KEY: hindcast-dev
      S3_BUCKET: hindcast-events
      ADMIN_SECRET: ci-only-never-production
      NEXT_PUBLIC_INGEST_URL: http://localhost:4100

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hindcast
          POSTGRES_PASSWORD: hindcast
          POSTGRES_DB: hindcast
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U hindcast -d hindcast"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Service containers can't set a command and minio/minio needs one,
      # so minio starts as a plain container instead.
      - name: start minio
        run: >-
          docker run -d --name minio -p 9000:9000
          -e MINIO_ROOT_USER=hindcast -e MINIO_ROOT_PASSWORD=hindcast-dev
          minio/minio server /data

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # By now minio has had the whole install to finish booting.
      - name: create events bucket
        run: >-
          docker run --rm --network host --entrypoint /bin/sh minio/mc -c
          "mc alias set local http://localhost:9000 hindcast hindcast-dev
          && mc mb --ignore-existing local/hindcast-events"

      - run: pnpm db:generate

      - run: pnpm --filter @hindcast/db migrate:deploy

      - run: pnpm -r build

      - run: pnpm -r typecheck

      - run: pnpm -r test
